device: cuda
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  max_images: 2000
model:
  image_size: 64
  lr_scale: 4
train:
  protocol: smoke
  seed: 42
  batch_size: 16
  num_workers: 2
  epochs: 1
  lr_g: 0.0002
  lr_d: 0.0002
  lambda_adv: 1.0
  lambda_cls: 1.0
  lambda_mrr: 10.0
eval:
  max_images: 200
  batch_size: 32
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  figure_dir: outputs/figures/smoke
  pred_dir: outputs/predictions/smoke
